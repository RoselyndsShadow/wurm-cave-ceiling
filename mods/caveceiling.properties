classname=net.roselyndsshadow.caveceiling.CaveCeiling
classpath=caveceiling.jar
sharedClassLoader=true
version=1.0

# Client-side only. No server mod or ModComm required.
enabled=true

# true: only intentional paving changes ceilings; reinforced/prepared bare cave floors stay rock.
# false: mirror every cave-floor tile type, including reinforced/prepared cave floors.
pavedOnly=true
